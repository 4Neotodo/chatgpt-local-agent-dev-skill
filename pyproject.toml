[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chatgpt-local-agent-dev-skill"
version = "0.3.0"
description = "Generate compact-serial or full-collaboration ChatGPT and local-Agent governance baselines."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "4Neotodo" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
project-governance-init = "project_governance_skill.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
project_governance_skill = ["templates/*.tpl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
